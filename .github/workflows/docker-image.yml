name: Create and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # GitHub ignores path filters for tag pushes, so releases always run.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.env'
      - '.github/workflows/docker-image.yml'
      - 'versions.yaml'
      - 'sogo-conf/**'
      - 'nginx-conf/**'
      - 'artifacts/**'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.env'
      - '.github/workflows/docker-image.yml'
      - 'versions.yaml'
      - 'sogo-conf/**'
      - 'nginx-conf/**'
      - 'artifacts/**'
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the versioned image to GHCR
        type: boolean
        required: true
        default: false
      build_platforms:
        description: The Docker image build platforms
        type: string
        required: true
        default: linux/amd64,linux/arm/v7,linux/arm64

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUBLISH_IMAGE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image) }}
  BUILD_PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || inputs.build_platforms || 'linux/amd64,linux/arm/v7,linux/arm64' }}

jobs:
  sogo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate image version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION=//p' .env | tr -d '\r')
          # Require a complete version that can be used unchanged as a Docker tag.
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || (( ${#version} > 128 )); then
            echo '::error::.env must contain one complete VERSION, e.g. 1.1.0 or 1.1.0-rc.1.'
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::The Git tag must match VERSION in .env with a v prefix.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        if: env.BUILD_PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to the Container registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          outputs: ${{ env.PUBLISH_IMAGE != 'true' && 'type=cacheonly' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          cache-from: type=gha,scope=sogo
          cache-to: type=gha,scope=sogo,mode=max

      - name: Generate artifact attestation
        if: env.PUBLISH_IMAGE == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
