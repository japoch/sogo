name: Create and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # GitHub ignores path filters for tag pushes, so releases always run.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.env'
      - '.github/workflows/docker-image.yml'
      - '.github/scripts/release-image.cjs'
      - '.github/scripts/package-manifests.cjs'
      - '.github/scripts/test_release_image.cjs'
      - 'versions.yaml'
      - 'sogo-conf/**'
      - 'nginx-conf/**'
      - 'artifacts/**'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.env'
      - '.github/workflows/docker-image.yml'
      - '.github/scripts/release-image.cjs'
      - '.github/scripts/package-manifests.cjs'
      - '.github/scripts/test_release_image.cjs'
      - 'versions.yaml'
      - 'sogo-conf/**'
      - 'nginx-conf/**'
      - 'artifacts/**'
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the versioned image to GHCR
        type: boolean
        required: true
        default: false
      build_platforms:
        description: The Docker image build platforms
        type: string
        required: true
        default: linux/amd64,linux/arm/v7,linux/arm64

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_DESCRIPTION: >-
    SOGo groupware with webmail, calendars and contacts, built from source on Debian
    with SOPE, NGINX and memcached. Supports AMD64, ARMv7 and ARM64;
    requires external database and mail services.
  PUBLISH_IMAGE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image) }}
  BUILD_PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || inputs.build_platforms || 'linux/amd64,linux/arm/v7,linux/arm64' }}

jobs:
  sogo:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      digest: ${{ steps.verify.outputs.digest }}
    # Publishing and package cleanup must never modify GHCR concurrently.
    concurrency:
      group: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image)) && format('ghcr-maintenance-{0}', github.repository) || format('docker-test-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test publishing safeguards
        run: node --test .github/scripts/test_release_image.cjs .github/scripts/test_delete_old_packages.cjs

      - name: Validate image version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION=//p' .env | tr -d '\r')
          # Require a complete version that can be used unchanged as a Docker tag.
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || (( ${#version} > 128 )); then
            echo '::error::.env must contain one complete VERSION, e.g. 1.1.0 or 1.1.0-rc.1.'
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::The Git tag must match VERSION in .env with a v prefix.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Check version ownership and existing image
        if: env.PUBLISH_IMAGE == 'true'
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        with:
          script: |
            const { run } = require('./.github/scripts/release-image.cjs');
            await run({ github, context, core, env: process.env, mode: 'prepare' });

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # GHCR reads multi-platform descriptions from the image index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.commit }}/README.md
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
          annotations: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.commit }}/README.md

      - name: Set up QEMU
        if: steps.prepare.outputs.build != 'false' && env.BUILD_PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.prepare.outputs.build != 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to the Container registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: steps.prepare.outputs.build != 'false'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          outputs: ${{ env.PUBLISH_IMAGE != 'true' && 'type=cacheonly' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ env.PUBLISH_IMAGE == 'true' && steps.meta.outputs.annotations || '' }}
          # Provenance also produces an index for single-platform publications.
          provenance: mode=max
          platforms: ${{ env.BUILD_PLATFORMS }}
          cache-from: type=gha,scope=sogo
          cache-to: type=gha,scope=sogo,mode=max

      - name: Verify published manifest, platforms and labels
        if: env.PUBLISH_IMAGE == 'true'
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest || steps.prepare.outputs.digest }}
        with:
          script: |
            const { run } = require('./.github/scripts/release-image.cjs');
            await run({ github, context, core, env: process.env, mode: 'verify' });

      - name: Generate artifact attestation
        if: env.PUBLISH_IMAGE == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.verify.outputs.digest }}
          push-to-registry: true

  release:
    if: github.event_name == 'push'
    needs: sogo
    runs-on: ubuntu-24.04
    # Recheck the image under the same lock before creating the release.
    concurrency:
      group: ghcr-maintenance-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sogo.outputs.commit }}
          persist-credentials: false

      - name: Create matching tag and GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.sogo.outputs.version }}
          RELEASE_COMMIT: ${{ needs.sogo.outputs.commit }}
          EXPECTED_DIGEST: ${{ needs.sogo.outputs.digest }}
        with:
          script: |
            // GITHUB_TOKEN creates the tag without triggering another workflow.
            const { run } = require('./.github/scripts/release-image.cjs');
            await run({ github, context, core, env: process.env, mode: 'release' });
