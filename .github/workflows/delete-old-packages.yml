name: Delete old Docker images

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: The container package whose old versions will be deleted
        type: string
        required: true
        default: sogo
      keep_versions:
        description: Number of newest release-only image versions to keep (at least 1)
        type: number
        required: true
        default: 2
      dry_run:
        description: Preview deletions without changing the package
        type: boolean
        required: true
        default: true
      min_age_hours:
        description: Minimum age since creation or update before deletion (at least 24 hours)
        type: number
        required: true
        default: 168

permissions:
  contents: read

concurrency:
  # Shared with Docker publishing, across branches and release tags.
  group: ghcr-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test cleanup logic
        run: node --test .github/scripts/test_delete_old_packages.cjs

      - name: Clean up old releases and orphaned manifests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          KEEP_VERSIONS: ${{ inputs.keep_versions }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { cleanupPackages } = require('./.github/scripts/delete-old-packages.cjs');
            await cleanupPackages({ github, context, core, env: process.env });
