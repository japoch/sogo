name: Codacy Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan (${{ matrix.codacy_tool }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      CODACY_CLI_V2_VERSION: 1.0.0-main.382.sha.473b61c
    strategy:
      fail-fast: false
      matrix:
        codacy_tool: [pylint, opengrep, trivy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Codacy Analysis CLI
        env:
          TOOL: ${{ matrix.codacy_tool }}
          CODACY_CLI_V2_TMP_FOLDER: ${{ runner.temp }}/codacy-cli
        shell: bash
        run: |
          .codacy/cli.sh analyze --tool "$TOOL" --format sarif --output "$TOOL.sarif" 2>&1 | tee "$RUNNER_TEMP/codacy.log"
          # The CLI can return success even when an individual scanner fails.
          if grep -q 'Tool failed to run:' "$RUNNER_TEMP/codacy.log"; then
            echo "::error::Codacy failed to run $TOOL; see the scanner log above."
            exit 1
          fi

      - name: Normalize SARIF report
        env:
          TOOL: ${{ matrix.codacy_tool }}
        run: python3 .github/scripts/normalize-sarif.py "$TOOL.sarif"

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ matrix.codacy_tool }}.sarif
          category: ${{ matrix.codacy_tool }}
